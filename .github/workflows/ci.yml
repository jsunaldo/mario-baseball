name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Rewrite the visual baselines from this run"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  unit:
    name: Regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/run.js
  visual:
    name: Layout checks (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.47.2 pixelmatch@6.0.0 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - run: node test/visual.js
        env:
          UPDATE_BASELINES: ${{ github.event.inputs.update_baselines == 'true' && '1' || '0' }}
      - name: Commit refreshed baselines
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_baselines == 'true'
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add test/baselines
          git diff --cached --quiet || (git commit -m "CI: refresh visual baselines" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test/screenshots/
          retention-days: 14
